name: OmniMarket CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "file:./dev.db"
  NEXTAUTH_SECRET: "ci-omnimarket-secret-key-2026"
  NEXTAUTH_URL: "http://localhost:3000"
  GOOGLE_CLIENT_ID: "ci-mock-google-id"
  GOOGLE_CLIENT_SECRET: "ci-mock-google-secret"
  GITHUB_ID: "ci-mock-github-id"
  GITHUB_SECRET: "ci-mock-github-secret"

jobs:
  quality-and-tests:
    name: Unit Tests, Build & E2E Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Schema
        run: npx prisma db push

      - name: Seed Initial Database
        run: npm run db:seed

      - name: Run 10 Unit Tests (Vitest)
        run: npm run test:unit

      - name: Build Production Next.js Application
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run 3 End-to-End Flows (Playwright)
        run: npm run test:e2e
