name: OmniMarket CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/omnimarket_test?schema=public"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/omnimarket_test?schema=public"
  NEXTAUTH_SECRET: "ci-omnimarket-secret-key-2026"
  NEXTAUTH_URL: "http://localhost:3000"
  GOOGLE_CLIENT_ID: "ci-mock-google-id"
  GOOGLE_CLIENT_SECRET: "ci-mock-google-secret"
  GITHUB_ID: "ci-mock-github-id"
  GITHUB_SECRET: "ci-mock-github-secret"
  # E2E bypass secret — must match the cookie value injected by E2E tests.
  # This variable must NOT be set in Vercel production to keep OAuth exclusive.
  E2E_SECRET: "true"
  # Secret token required by POST /api/test/reset-data to prevent unauthorized DB wipes.
  RESET_SECRET: "e2e-reset-secret"


jobs:
  quality-and-tests:
    name: Unit Tests, Build & E2E Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omnimarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Schema
        run: npx prisma db push

      - name: Seed Initial Database
        run: npm run db:seed

      - name: Run 10 Unit Tests (Vitest)
        run: npm run test:unit

      - name: Build Production Next.js Application
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run 3 End-to-End Flows (Playwright)
        run: npm run test:e2e

      - name: Deploy to Vercel (Only on Tests Pass)
        if: success() && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
          else
            echo "All 10 Unit Tests and 3 E2E Flows passed. Ready for Vercel deployment."
          fi
